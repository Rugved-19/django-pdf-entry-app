{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Choose Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h2>Select a Login</h2>
  <div class="row">
    {% for name in usernames %}
    <div class="col-md-2">
      <a href="{% url 'user_page' name %}" class="btn btn-primary btn-lg w-100 m-2">{{ name }}</a>
    </div>
    {% endfor %}
  </div>
</div>
</body>
</html>

</html>
