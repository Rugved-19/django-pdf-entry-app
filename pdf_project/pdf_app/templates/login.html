<!-- templates/login.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        body {
            background: linear-gradient(135deg, #f0f8ff, #47f1f1);
            font-family: 'Segoe UI', sans-serif;
        }
        .card:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
        }
        .card {
            height: 140px;
        }
        .fade-in-up {
            animation: fadeInUp 1s ease forwards;
        }
    </style>
</head>
<body class="p-5">
  <div class="container">
    <h2 class="mb-4 text-center">Select User to Login</h2>

    <div class="row g-3">
        {% for user in users %}
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="card text-white bg-info text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ user.name }}</h5>
                    <a href="{% url 'user_page' user.id %}" class="btn btn-primary m-1">Enter</a>
                    <form method="post" action="{% url 'delete_user' user.id %}" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete {{ user.name }}?');">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center mt-4 gap-3">
        <a href="{% url 'register_user' %}" class="btn btn-outline-secondary btn-lg w-100 w-md-auto">➕ Register New User</a>
        <a href="{% url 'generate_combined_pdf' %}" class="btn btn-primary btn-lg w-100 w-md-auto">📄 Download Combined PDF</a>
        <a href="{% url 'delete_all_entries_global' %}" class="btn btn-danger btn-lg w-100 w-md-auto">🗑️ Delete All Entries</a>
    </div>
</div>
</body>
</html>
